name: Finalize audited SymArc 023
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-023-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Verify frozen sources and synthetic controls
        shell: bash
        run: |
          set -euo pipefail
          E=symarc/experiments/023-query-applicability
          echo "38d287293884489543cc6f8934f17526cd3fc06c24f77b7e11794f199be80461  $E/run.py" | sha256sum -c -
          echo "474afd1c699f7e16c29b168fc10419b3783570cccdcf531fdb38d3fc2fa861bd  $E/test_run.py" | sha256sum -c -
          echo "64c67759691270d1181ed44a7b3d92cbab92825a37199f045120be9eb5ffe0e5  $E/audit.py" | sha256sum -c -
          echo "0f18779c4de20b6675bf86a35785ef2e28ff41ff422f8ba3577ea200f882d668  $E/compare_baseline.py" | sha256sum -c -
          mkdir -p archive
          {
            python3 "$E/test_run.py"
            python3 symarc/experiments/018-order-guards/test_run.py
            python3 symarc/experiments/021-default-exceptions/test_run.py
          } > archive/synthetic-checks.txt 2>&1
          cat archive/synthetic-checks.txt
      - name: Finalize only the new experiment entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('symarc/experiments/RESULTS.md')
          text=p.read_text()
          start=text.index('### 023-query-applicability')
          end=text.index('## Entry format',start)
          assert '### ' not in text[start+4:end]
          entry='''### 023-query-applicability — Can query-input applicability resolve selection ties?
          Status: candidate — narrow tie-completion selector and explicit failure controls retained; no integration.
          Baseline: `784f282d`; protocol/source hashes `0f721f6a`, active ledger `a52a5c77`, before scientific runs. Same 018/021 features, operation tables, search bound and internal evidence ranking. All ARC1 400+400 and 022's 24 controlled specifications; reused public/development data, not untouched holdout. Twelve workers per serial deterministic batch; answers read only after both modes' predictions were frozen.
          Comparison: baseline; prefer complete models only among best-evidence ties; prefer completeness before evidence; consensus among best-evidence complete models. Every outer fold rebuilds search/inner ranking and uses only the withheld INPUTS for selection. Joint-query and per-query sensitivity is separately recorded. Complete baseline answers are preserved by the non-consensus policies by construction; new complete predictions can be wrong.
          ARC1 result: tie-completion adds `e9afcf9a` in both modes. Base relational 27 to 28 correct, one complete error unchanged; default 29 to 30 correct, four complete errors unchanged. No-fit compositions increase 78 to 79 and 80 to 81 training tasks, respectively; evaluation stays 27/400. Excluding fixtures: base 76/398 to 77/398, default 78/398 to 79/398; 27/399 evaluation unchanged. Exact-candidate and stable-code behavior are not modified.
          Negative controls: complete-first/default reaches 31 relational / 82 hybrid training successes but seven complete relational training errors and one evaluation error. Base gets no further success and adds one error. Tie-consensus/default gains `e9afcf9a` but rejects the correct development task `29c11459` because tied complete models disagree. No new ARC2 score. Hybrid task losses are zero here but are not structurally guaranteed by raw-model preservation.
          Controlled result: with both palette/row contrasts, every query-aware policy solves 216/216 crossed grids and 84/84 legacy grids, versus 144/216 and 56/84. These are six previously inspected teachers, not independent ARC tasks. Missing contrasts still permit errors. Former literal-background failures now select [near.max_degree, compare(W,E), west-endpoint-defined], not a uniquely recovered intended scope. All combined-variation outer checks still fail; they relearn from a single demonstration.
          Mechanisms: `e9afcf9a` changes a colour-specific key to west-run length plus north-operation validity, producing the correct 2x6 colour-alternating query. Both internal evidence scores are zero; no parity/width law was learned. Query-batch sensitivity appears on `d5d6de2d` under broader policies and on controlled confounded designs, not on the 216/216 combined-variation result.
          Checks: 15 new synthetic tests and all 15 018 / 12 021 tests pass. Independent explicit-set audit reconstructs 118024 tables, 3498856 context sets, 133504 candidate occurrences, 34448 full/outer/per-query policy choices, 13896 outer-grid scores, 6592 raw and 6400 hybrid task scores. Input extraction/search reused; new selection independently reimplemented. All 800 base ARC1 tasks / 5614 models / 1689 outer folds match 019; both controlled modes match 022's 4188 models and 48 folds each. All four 12-worker prediction runs repeat byte-for-byte. Source files published unchanged with results after pre-run hash registration; finalization also verifies all four published Python hashes and repeats 42 synthetic tests.
          Decision: retain tie-completion as a measured small selection candidate, not a correctness gate. Next distinction is conditioning concrete action hypotheses on required query definedness rather than preferring already-unanimous model families. Neither domain filtering nor conditional unanimity guarantees truth outside the declared hypothesis class. Stable core, old wrappers and accepted mathematics unchanged.
          Code/evidence: [protocol and sources](023-query-applicability/README.md), [findings](evidence/023-query-applicability/README.md), all factorial outcomes, audits and selected case certificates. Full candidates, outer pools, inputs, separate answers, dependencies and reproduction script in companion archive. Base ARC1 prediction SHA-256 `de6cbb72e0728899190a7e185f07f26c7aef7f680adc03b464453e10581f95f6`; default `c15515956f88b17319b738a94715210bb1960dcfe633aa04c50a5383af006ed4`.

          '''
          # Strip only the common YAML indentation, preserving the heading.
          lines=entry.splitlines()
          entry=lines[0]+'\n'+textwrap.dedent('\n'.join(lines[1:]))+'\n\n'
          p.write_text(text[:start]+entry+text[end:])
          Path('.github/workflows/symarc-023-finalize.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/experiments/RESULTS.md .github/workflows/symarc-023-finalize.yml
          git commit -m 'experiments: record audited applicability outcomes; remove completed workflow'
          git push origin HEAD:symarc/stable-core
          git rev-parse HEAD > archive/source-revision.txt
          tar -czf archive/source-snapshot.tar.gz symarc/experiments/023-query-applicability symarc/experiments/evidence/023-query-applicability symarc/experiments/RESULTS.md
          sha256sum archive/source-snapshot.tar.gz > archive/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symarc-023-source-snapshot
          path: archive/
          retention-days: 90
          if-no-files-found: error
