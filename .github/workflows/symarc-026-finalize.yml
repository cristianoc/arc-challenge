name: Verify construction and finalize SymArc 026
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-026-finalize.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Reproduce frozen construction and independent audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-replay
          git rev-parse HEAD > proof-replay/execution-revision.txt
          python3 --version > proof-replay/python-version.txt
          python3 symarc/experiments/026-constructed-predicates/reproduce.py --out "$RUNNER_TEMP/arc026" 2>&1 | tee proof-replay/reproduction.log
          cp -r "$RUNNER_TEMP/arc026" proof-replay/experiment
      - name: Record verified results and remove completed one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap
          p=Path('symarc/experiments/RESULTS.md');old=p.read_text()
          entry='''
          ### 026-constructed-predicates — Can a reusable predicate be constructed in a common low-level grammar?
          Status: candidate — retain the bounded construction harness and its exact negative control. Stable mathematical results are integrated in the core Lean library; the classifier is not a solver policy.
          Baseline: `92a73f49`; protocol `8ca83c78`, source hashes `4b70b9e1`, active entry before data preparation. Source published unchanged after local execution. Separate accepted integration at `9cc9006f` imports 15 theorems in `SymArc/Learning.lean`; successful Lean 4.34.0 build/axiom audit and unchanged Rust checks in Actions run 35452954813. Core documentation in `LEARNING.md`, indexed by `MATH.md`, and persistent mathematics CI.
          Comparison: supplied finite cell sets, count and coordinate spans, generic arithmetic/Boolean constructors, no rectangle atom. Enumerate 945 typed predicates through expanded AST size five; complete if/constant/constant programs cost eight. Direct branch-assignment enumeration versus class/action coherence construction, same source evidence and all minimum programs; no training-trace expression merging or macro cost discount.
          Result: from all 511 nonempty 3x3 subsets, construct `count(S) = span(rows(S))*span(cols(S))`; the equivalent strict-inequality/complement program also survives. Direct and constructive minimum sets agree exactly. All 65535 4x4 subsets classified correctly, including 100 positives; 511 are exact source overlaps, so genuinely unseen score is **65024/65024**, including 64 positives. Larger/translated bank **3085/3085**, 21 positives, no source overlap. Constructed geometry checks, not ARC scores or sparse-example discovery.
          Work/reuse: both evaluate 945 predicates on 511 examples. Label checks 12230/direct versus 5919/constructive; leaf assignments 3780 versus two. Four new label maps reuse the learned partition, with full body cost retained. Construction plus four adaptations uses 5935 label checks versus 61198 cold resynthesis; this is caching/amortization, not a new predicate-search speedup or reuse across unrelated tasks. Expanded aliases preserve canonical candidates, costs and outputs by construction.
          Negative control: a hollow frame and a nonframe have identical count/spans `(8,3,3)` but different labels; no expression of those observations can separate them at any depth. The source pair is masks 255/495. No new frame primitive is added. Counting/axes/extrema and a target-compatible source problem are explicit supplied priors; segmentation and richer spatial observation construction remain open implementation work.
          Checks: 12 synthetic tests and 120 direct/constructive comparisons. Independent auditor imports neither learner module, reconstructs all 945 predicates and minimum programs, verifies 943 rejection witnesses, overlap and 480340 output replays. Changed query inputs/transfer labels leave the source library identical. Complete repeated local construction and checked reproduction script match library, construction, predictions, scores and audit hashes. This finalization independently repeats that script on GitHub before recording completion.
          Decision: integrate only the stable mathematical structure: operation-relative coherence/refinement/conflicts, no greatest coherent quotient, nonvacuous prediction, exact independent/coupled conditioning and unobserved fallback obstruction. The next construction target is richer observations and nontrivial downstream use, not another ranking adjustment. Rust solver and existing scores/wrappers unchanged.
          Code/evidence: [protocol and runnable sources](026-constructed-predicates/README.md), [report](evidence/026-constructed-predicates/README.md), compact results, and `reproduce.py`. Prediction SHA-256 `e3b3a78942378b6de83a10b89ad9d296e1706e2327c42d1574619d954bd5c372`; library `7ea82c7a4157ab85e0440f0319ef7f48339b8e4ab1704bf84d76fa0deb1c3195`. The archive includes full source/data/evidence and accepted mathematics checks.

          '''
          pattern=r'^### 026-constructed-predicates\b.*?(?=^### |^## Entry format)'
          new,n=re.subn(pattern,textwrap.dedent(entry).lstrip(),old,flags=re.M|re.S)
          assert n==1,n
          p.write_text(new)
          Path('.github/workflows/symarc-026-finalize.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/experiments/RESULTS.md .github/workflows/symarc-026-finalize.yml
          git commit -m 'math and research: retain checked learning core and verified predicate construction'
          git push origin HEAD:symarc/stable-core
          git rev-parse HEAD > proof-replay/final-revision.txt
          mkdir -p archive
          tar -czf archive/symarc-math-026-evidence.tar.gz proof-replay symarc/SymArc symarc/SymArc.lean symarc/lakefile.toml symarc/lean-toolchain symarc/lake-manifest.json symarc/tests/learning_axioms.lean symarc/MATH.md symarc/LEARNING.md symarc/README.md symarc/experiments/026-constructed-predicates symarc/experiments/evidence/026-constructed-predicates symarc/experiments/RESULTS.md .github/workflows/symarc-math.yml
          sha256sum archive/symarc-math-026-evidence.tar.gz > archive/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symarc-math-026-verified
          path: archive/
          retention-days: 90
          if-no-files-found: error
