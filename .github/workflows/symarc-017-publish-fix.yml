name: Complete audited SymArc 017 publication
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-017-publish-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Verify corrected transport and execute the registered publication
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,re,subprocess,textwrap
          from pathlib import Path
          source=Path('.github/workflows/symarc-017-publish.yml').read_text()
          parts={k:v for k,v in re.findall(r'^          (PAYLOAD[123]): (\S+)$',source,re.M)}
          assert set(parts)=={'PAYLOAD1','PAYLOAD2','PAYLOAD3'}
          old='gECH78ogVvHCN78c5QuDO'; new='gECH78ogVvHCNw5QuDO'
          assert parts['PAYLOAD3'].count(old)==1
          parts['PAYLOAD3']=parts['PAYLOAD3'].replace(old,new)
          blob=''.join(parts['PAYLOAD'+str(i)] for i in (1,2,3))
          Path('transfer').mkdir(exist_ok=True)
          Path('transfer/publication-payload.txt').write_text(blob)
          assert hashlib.sha256(blob.encode()).hexdigest()=='c9a74f3e4ae150e326f5b34d52708583f63e1e2bed94eb53bc492a35384872be'
          assert len(json.loads(gzip.decompress(base64.b64decode(blob))))==7
          script=textwrap.dedent(source.split('        run: |\n',1)[1].split('\n      - uses:',1)[0])
          correction="""
          report='symarc/experiments/evidence/017-split-or-share/README.md'
          files[report]=files[report].replace('Both temporary source/evidence\\nwriteback workflows remove themselves','Temporary source/evidence\\nwriteback workflows remove themselves')
          files[report]+='\\nPublication note: a mistyped compressed upload was rejected by its checksum before any evidence was written. The corrected transport was verified against the local payload hash; scientific sources and results were unchanged.\\n'
          """
          script=script.replace('for name,content in files.items():',textwrap.dedent(correction)+'\nfor name,content in files.items():',1)
          script=script.replace("Path('.github/workflows/symarc-017-publish.yml').unlink()", "Path('.github/workflows/symarc-017-publish.yml').unlink()\nPath('.github/workflows/symarc-017-publish-fix.yml').unlink()")
          script=script.replace('git add symarc/experiments/017-split-or-share ', 'git add .github/workflows/symarc-017-publish-fix.yml symarc/experiments/017-split-or-share ',1)
          env=os.environ.copy();env.update(parts)
          subprocess.run(['bash','-e','-o','pipefail','-c',script],env=env,check=True)
          Path('transfer/publication-payload.txt').unlink()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: symarc-017-published
          path: transfer/
          retention-days: 90
          if-no-files-found: error
