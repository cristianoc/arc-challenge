name: Reproduce frozen SymArc 014
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-014-reproduce.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: arcprize/ARC-AGI-2
          ref: f3283f727488ad98fe575ea6a5ac981e4a188e49
          path: arc2-pinned
          persist-credentials: false
      - name: Reproduce without changing the frozen policy
        shell: bash
        run: |
          E=symarc/experiments/014-cross-demonstration-transport
          echo "572c8870bd00abf97a49fa4280c994ae9bca56cc14391408ec7fd94f166aa3f4  $E/run.py" | sha256sum -c -
          echo "d375184adaafd11741b68e63910359191b686d450e690158ed0ef04890163863  $E/test_run.py" | sha256sum -c -
          python3 "$E/test_run.py"
          python3 "$E/run.py" prepare --data arc2-pinned/data --out arc014/input
          python3 "$E/run.py" predict --problems arc014/input/problems.json --out arc014/run --workers 12
          echo '3d328547540d6d97eabc228bc5999b554b2ebdacae826f0638e183a9511cce22  arc014/run/predictions.json' | sha256sum -c -
          python3 "$E/run.py" score --predictions arc014/run/predictions.json --answers arc014/input/answers.json --out arc014/run
          python3 "$E/audit.py" --data arc2-pinned/data --run arc014/run
          python3 "$E/case_e88171ec.py" --task arc2-pinned/data/training/e88171ec.json --out arc014/run/rectangle-case.json
          git rev-parse HEAD > arc014/source-revision.txt
          git -C arc2-pinned rev-parse HEAD > arc014/data-revision.txt
          mkdir -p archive
          tar -czf archive/symarc-014-full-evidence.tar.gz arc014/run arc014/input/data.json arc014/source-revision.txt arc014/data-revision.txt "$E"
          sha256sum archive/symarc-014-full-evidence.tar.gz > archive/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symarc-014-full-evidence
          path: archive/
          retention-days: 90
          if-no-files-found: error
