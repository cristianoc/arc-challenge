name: Register construction and accepted learning theory
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-026-register.yml]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Update navigation and the single experiment ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('symarc/MATH.md');text=p.read_text()
          old='# Functional closure under symmetry\n'
          assert text.startswith(old)
          intro='''# Accepted mathematical core

          The checked library now has two complementary parts:

          - [Operation-relative abstraction and exact conditioning](LEARNING.md),
            checked in [SymArc/Learning.lean](SymArc/Learning.lean): coherent
            operation sharing, conflict witnesses, absence of a greatest coherent
            quotient, nonvacuous prediction, and exact whole-family conditioning.
          - Functional closure and equivariance, described below and checked in
            [SymArc/Theory.lean](SymArc/Theory.lean).

          Both are imported by the standard `lake build` target. Experimental
          selection priors, confidence scores and benchmark claims are not part of
          this accepted mathematics. The new learning theorems do not verify the
          Python research implementations or change the stable Rust solver.

          ## Functional closure under symmetry
          '''
          import textwrap
          p.write_text(textwrap.dedent(intro)+text[len(old):])
          p=Path('symarc/README.md');text=p.read_text()
          text=text.replace('One Rust solver and a Lean mathematical model for exploring abstraction,\nprogram entropy, and functional closure under symmetry.',
          'A stable Rust solver and a checked Lean mathematical core for studying\noperation-relative abstraction, program families, and functional closure under symmetry.')
          text=text.replace('current definitions, proved statements, and approximation boundaries.',
          'current definitions, proved statements, and approximation boundaries.\n[LEARNING.md](LEARNING.md) gives the integrated abstraction/conditioning account;\nexperimental construction procedures and their evidence remain separate.')
          p.write_text(text)
          p=Path('symarc/experiments/RESULTS.md');text=p.read_text()
          assert '### 026-constructed-predicates' not in text
          entry='''
          ### 026-constructed-predicates — Can a reusable predicate be constructed in a common low-level grammar?
          Status: active — protocol and source hashes frozen; no scientific outcomes yet.
          Baseline: `92a73f49`; protocol `8ca83c78`, source hashes `4b70b9e1`. Separate accepted-core integration adds 15 Lean results on operation-relative coherence and exact conditioning, with successful `lake build`, axiom audit and Rust checks in Actions run 35452954813. No solver policy is integrated.
          Comparison: finite cell sets observed through count and coordinate spans; synthesize arithmetic/Boolean predicates through expanded size 5 and constant-branch programs through size 8. Direct program enumeration versus class/action compatibility construction, exact minimum-program-set equality, explicit library-body cost, and alias invariance. Generic counts/spans/operators supplied; no rectangle atom. One deterministic semantic/work-count study, not a runtime comparison or ARC benchmark.
          Data: all 511 nonempty 3x3 subsets for construction, all 65535 nonempty 4x4 subsets plus fixed larger/translated banks for scoring; row-interval teacher independent of arithmetic learner. Four branch-label transfer tasks receive the same source evidence in both methods. Hollow-frame task is a vocabulary-conflict control; no post-score primitive extension. Query inputs/answers do not enter predicate selection.
          Checks: twelve pre-run tests including 120 direct/constructive comparisons. Exact rejection witnesses, independently enumerated grammar/programs, independent geometry scoring and reproduction required. No outcome or speedup claimed yet.
          Code/evidence: [registered protocol](026-constructed-predicates/README.md); frozen source hashes in preregistration.json. Stable Rust core and previous experimental wrappers unchanged.

          '''
          p.write_text(text.replace('## Entry format',textwrap.dedent(entry)+'## Entry format'))
          Path('.github/workflows/symarc-026-register.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/MATH.md symarc/README.md symarc/experiments/RESULTS.md .github/workflows/symarc-026-register.yml
          git commit -m 'math: integrate accepted learning account and register construction protocol'
          git push origin HEAD:symarc/stable-core
