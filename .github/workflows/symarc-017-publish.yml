name: Publish audited SymArc 017
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-017-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Publish checked sources and evidence
        env:
          PAYLOAD1: 
          PAYLOAD2: 
          PAYLOAD3: 
        run: |
          python3 - <<'PY'
          import base64,gzip,json,os,re
          from pathlib import Path
          blob=''.join(os.environ['PAYLOAD'+str(i)] for i in (1,2,3))
          # Check the complete compressed stream before writing any file.
          files=json.loads(gzip.decompress(base64.b64decode(blob)))
          for name,content in files.items():
              assert name.startswith(('symarc/experiments/017-split-or-share/','symarc/experiments/evidence/017-split-or-share/'))
              p=Path(name); assert not p.exists(), name
              p.parent.mkdir(parents=True,exist_ok=True); p.write_text(content)
          ledger=Path('symarc/experiments/RESULTS.md'); text=ledger.read_text()
          pattern=r'### 017-split-or-share[^\n]*\n.*?(?=\n### |\n## Entry format)'
          old=re.findall(pattern,text,re.S); assert len(old)==1 and 'Status: active' in old[0]
          entry='''### 017-split-or-share — Split a context, or share a better operation?
          Status: candidate — exact general conflict learner and audited research comparison retained; no stable-solver integration.
          Baseline: `71c9efdf`; protocol `f37093f7`; source hashes, active ledger and code frozen at `2fe31f5a` before corpus execution. Official ARC-AGI-2 `f3283f7`, all 1000 training + 120 evaluation tasks; two development fixtures excluded (998/120 primary denominators, 678/81 eligible). Public development data, not untouched holdout. Twelve workers, deterministic; 19.147s is provenance only.
          Comparison: base/split/share/joint factorial: 15 vs 19 features and 11 vs 19 operations. A supplied same-colour directional walk supplies run lengths or beyond-run copies; adjacent copies included. Exact deletion-minimal conflict sets, minimal feature subsets of size <=3, nested whole-demonstration validation and a union selector preserving base candidates. Unknown keys, disagreeing actions and undefined surviving actions abstain. Queries frozen before separate scoring.
          Result: training fits base/split/share/joint = 72/150/73/156; correct complete queries = 22/24/21/24; wrong complete queries = 4/5/2/3. Union solves 25 with five complete errors, gaining three correct tasks and losing none versus base. Union gate retains 12 correct answers and removes five errors, but discards 13 correct answers. Evaluation fits 4/5/4/5, no complete answer in any arm. Union candidate oracle is 26, leaving one selection opportunity. These are experimental learner scores, not the stable Rust solver.
          Mechanisms: `29c11459` requires both run-length distinctions and endpoint-copy operations; neither arm alone solves it. Its key is still a numeric lookup, not a learned arbitrary-width nearer-endpoint rule. On `d5d6de2d`, richer actions introduce undefined surviving hypotheses and lose a complete answer; union retains the base explanation. Joint training failures: 304 vocabulary conflicts and 218 feature-bound failures, versus base 602/4. Fitting growth substantially exceeds query gains.
          Certificates: 9,262 two-point, 303 three-point, 14 four-point and 32 five-point minimal inconsistencies, counted across arms/models. `7e0986d6` has four identical-feature training points: any three share a direction copy, all four cannot. A separately registered post-primary training-only StrictNeighbourMajority probe (`bb8bf2e2`) resolves that core but not the whole task; full-feature fits increase 374 to 376 training, stay 32 evaluation. No supplementary query scoring or automatically invented-operation claim.
          Checks: 16 synthetic controls, 150 guided/exhaustive small searches, 761 base-pool and 2,352 base-outer-fold matches to 016. Independent audit checks 30,032 exhaustive subsets, 9,611 conflict/necessity certificates, 5,600 policy/task scores and 11,760 outer predictions. The outer selector is not independently reimplemented. A second 12-worker run is byte-identical. Temporary writeback workflows remove themselves; scientific runs are local.
          Decision: retain exact split-or-share research machinery, not a production gate. Next target is relational rules and applicability instead of exact numeric lookup; any extension must be rebuilt inside outer validation. Stable core and accepted mathematics unchanged.
          Code/evidence: [protocol and sources](017-split-or-share/README.md), [majority sensitivity protocol](017-split-or-share/MAJORITY_AUDIT.md), [findings](evidence/017-split-or-share/README.md), results/provenance, selected certificates and independent audit. Full frozen predictions and checked reproduction script are in the investigation archive. Prediction SHA-256 `17cbb1bbca38c9ff3743a633bfe995498cd614291c042f13ba7bfbadb919fc05`.
          '''
          ledger.write_text(re.sub(pattern,lambda _:entry,text,flags=re.S))
          Path('.github/workflows/symarc-017-publish.yml').unlink()
          PY
          python3 symarc/experiments/017-split-or-share/test_run.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/experiments/017-split-or-share symarc/experiments/evidence/017-split-or-share symarc/experiments/RESULTS.md .github/workflows/symarc-017-publish.yml
          git commit -m 'research: record split-or-share results and exact conflict audits'
          git push origin HEAD:symarc/stable-core
          mkdir -p transfer
          git rev-parse HEAD > transfer/source-revision.txt
          tar -czf transfer/arc017-published.tar.gz symarc/experiments/017-split-or-share symarc/experiments/evidence/017-split-or-share symarc/experiments/RESULTS.md
          sha256sum transfer/arc017-published.tar.gz > transfer/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symarc-017-published
          path: transfer/
          retention-days: 90
          if-no-files-found: error
