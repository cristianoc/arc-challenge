name: Finalize audited SymArc 022
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-022-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Verify frozen code and record audited result
        shell: bash
        run: |
          set -euo pipefail
          E=symarc/experiments/022-demonstration-design
          echo "19bb19929c3d1a5c090db49644e95b53e8345357452dff1aa66febdf44906892  $E/run.py" | sha256sum -c -
          echo "322eb3bdb5f3a74a05d008a07de1f480d6989baf23645512ad4c5590f1720513  $E/test_run.py" | sha256sum -c -
          python3 "$E/test_run.py"
          python3 - <<'PY'
          import re, textwrap
          from pathlib import Path
          p=Path('symarc/experiments/RESULTS.md')
          old=p.read_text()
          entry='''### 022-demonstration-design — Does independently varied evidence resolve operation and scope ambiguity?
          Status: closed — controlled equal-budget design result, no integration. Retain driver, literal controls and rejection certificates as scope-learning regression fixtures.
          Baseline: `3f75fee8`; protocol/source hashes `2c264eb5`, source `ea14fb92`, tests `32febd71`; active registration workflow 35433346449 completed before prediction. Unchanged 018/021 learners, six previously inspected artificial teachers, no new ARC scores. Twelve workers per learner, serial modes, predictions persisted before scoring.
          Comparison: independently vary second-example palette and row position. Every condition contains two grids, 90 labelled output cells and four nonzero input cells. Primary queries fully cross width, height, palette and active row (36 per teacher, 216 per design); separate overlapping legacy bank checks 021. Teacher labels and row-translation semantics are researcher supplied, not ARC augmentation ground truth.
          Result, identical selected-grid counts for base/default: no variation 12 correct/76 complete wrong/128 incomplete; colour only 36/84/96; row only 0/0/216; both **144/0/72**. Copy-near/far and literal-fill-near/far each go 6/36 to 36/36 with both variations; literal-background variants go 6/36 to 0/36 through abstention. All strict outer checks fail, including the four fully solved teachers, because each reconstruction sees only one demonstration. Legacy original design reproduces 42/84 correct, 18 wrong and 24 incomplete.
          Mechanism: row movement creates explicit empty action intersections under all six old guards; the data, not a new ranking preference, reject them. Both variations select canvas-border membership, west/east comparison and west-endpoint validity for four teachers. Literal-background learners instead select colour/comparison/west-validity; only their two new-colour endpoint cells remain unknown in each query. An available endpoint-validity candidate solves every query but ties validation (634/385) and loses supplied cost 19 versus 15. No tie-break repair after scoring.
          Limitations: six fixed teachers are not independent grid samples, no hidden ARC improvement or automatically discovered intervention. Successful selected predictions do not imply unique target identification; some other retained candidates still make complete wrong grids. Unchanged evidence budgets do not imply matched search cost. Outer rejection is not proof that the two-example learner cannot transfer.
          Checks: eight new tests, 12 existing 021 and 15 existing 018 controls; independent interpreter verifies 1248 teacher grids and all 24 budgets. Set-based audit verifies 2400 query replays/scores, 96 inner and 96 outer grids, 48 full-data choices and six minimal old-guard certificates. Primitive extraction, feature search and outer selection are not independently reimplemented. Both repeated prediction files are byte-identical. Runtime is provenance only; exact timing boundaries are recorded by the driver.
          Decision: evidence must vary the distinctions under investigation; operation preference alone did not supply scope evidence. Keep the measured ARC1 compositions separate. Query-input applicability as a way to break the remaining cost tie is a possible future policy, not part of these results. Stable core and accepted math unchanged.
          Code/evidence: [protocol and driver](022-demonstration-design/README.md), [findings](evidence/022-demonstration-design/README.md), compact outcomes and audit certificates; full compressed predictions, source dependencies and replay in the investigation archive. Base/default prediction SHA-256 `75a251c9c28f75985d3862581f0ca8889beb7be09ef539203c91a6e82f8e4931` / `86e9d198f5e8f6b9ac1bed42b5fa14b4681f152ff6bf71d76c8f3c14d41019e2`.
          '''
          # Preserve any later experiment added concurrently; replace only 022.
          lines=entry.splitlines();entry=lines[0]+'\n'+textwrap.dedent('\n'.join(lines[1:]))+'\n'
          new,n=re.subn(r'### 022-demonstration-design[^\n]*\n.*?(?=\n### |\n## )',lambda _:entry,old,count=1,flags=re.S)
          assert n==1 and new!=old
          p.write_text(new)
          Path('.github/workflows/symarc-022-finalize.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/experiments/RESULTS.md .github/workflows/symarc-022-finalize.yml
          git commit -m 'experiments: record equal-budget diversity result; remove completed workflow'
          git push origin HEAD:symarc/stable-core
          mkdir -p archive
          git rev-parse HEAD > archive/source-revision.txt
          tar -czf archive/source-snapshot.tar.gz "$E" symarc/experiments/evidence/022-demonstration-design symarc/experiments/RESULTS.md
          sha256sum archive/source-snapshot.tar.gz > archive/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symarc-022-source-snapshot
          path: archive/
          retention-days: 90
          if-no-files-found: error
