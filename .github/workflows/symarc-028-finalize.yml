name: Verify and finalize SymArc 028
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-028-finalize.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Verify frozen code and reproduce semantic results
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          e=Path('symarc/experiments/028-generality-reduction')
          meta=json.loads((e/'preregistration.json').read_text())
          for name,expected in meta['source_hashes'].items():
              actual=hashlib.sha256((e/name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)
          PY
          python3 symarc/experiments/028-generality-reduction/reproduce.py --out /tmp/symarc028 > /tmp/symarc028-reproduction.log 2>&1
          cat /tmp/symarc028-reproduction.log
      - name: Record completed study and remove temporary workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap
          p=Path('symarc/experiments/RESULTS.md');old=p.read_text()
          entry='''### 028-generality-reduction — Can reduction of semantic scope guide evidence?
          Status: candidate — retain exact consequence-reduction analysis and controls; no solver or core-math integration.
          Baseline: `ed4b76bd`; protocol `ef49ae6c`, active entry and source hashes `e72ab8ce` before scientific execution. Same 027 point grammar, no new predicates; classifiers quotiented by exact behaviour over 401 semantic input classes, yielding 260 functions. Explicit equal semantic-class weighting, not an ARC probability model. Sources frozen locally before running and published unchanged with findings.
          Method: retain lower/upper positive extensions of all fitting functions. Consistent new labels expand the lower and contract the upper bound. Compare first-informative, hypothesis-halving, negative-only contraction and worst-case two-sided scope contraction. Eight constructed teacher rules (four related geometries plus label complements), same two seed inputs and at most eight additional oracle labels. No guessed labels, ARC score or untouched-holdout claim.
          Decisive contrast: in the all-Boolean-template diagnostic, adding either a positive singleton or negative solid square halves fitting point-table programs 256 to 128 and semantic classifiers 36 to 18. Yet disputed classes fall 393 to 392 versus seven. False-positive possibilities on the 4x4 bank remain 65399 versus fall to 24. Hypothesis-count reduction does not determine consequence reduction.
          Acquisition: by five extra labels, first/halving/negative-only/scope uniquely identify 4/4/5/8 of eight rules; by eight labels 4/8/6/8. Halving's cheapest selected functions already score perfectly for eight rules at five labels: the gain is identification, not final selected accuracy at that budget. Scope uses 28 versus 34 total requested labels to identify all eight, but is worse on missing-corner (three versus two). Negative-only is label-sensitive and leaves 118 hypotheses on complemented filled-box after eight requests.
          Boundaries: the frame's bounded four-candidate space is identified with one new label; this is not the unbounded six-example certificate from 027. Guaranteed interval monotonicity requires a nonempty realizable family and correct labels; a misspecified thickness-two pair correctly empties it. Cheapest-program changes include specialisations, generalisations and incomparable replacements, so no irreversible narrowing claim. Ordinary ARC has no supplied teacher oracle.
          Checks: 12 synthetic tests, 300 envelope comparisons; independent auditor imports neither scientific module, enumerates 90690 trees, verifies 260 classifier extensions/costs, 133 request choices, 1855 eliminations, 165 states, 12 complement pairs, 67852 geometric inputs and 330 bank/state scores. Local full reproduction is byte-identical; finalization repeats it on GitHub before recording this entry.
          Code/evidence: [protocol and sources](028-generality-reduction/README.md), [findings](evidence/028-generality-reduction/README.md), compact results and scientific hashes. Prediction SHA-256 `5c0f09731eb2ba6a190b760f9827832433039d84b2d10572247a1aa631ff7108`. Full traces and checked reproduction package retained. Stable Rust solver, existing ARC wrappers and accepted Lean mathematics unchanged.

          '''
          new,n=re.subn(r'^### 028-generality-reduction\b.*?(?=^### |^## Entry format)',textwrap.dedent(entry),old,flags=re.M|re.S)
          assert n==1
          p.write_text(new)
          Path('.github/workflows/symarc-028-finalize.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/experiments/RESULTS.md .github/workflows/symarc-028-finalize.yml
          git commit -m 'experiments: record verified generality-reduction result'
          git push origin HEAD:symarc/stable-core
          mkdir -p archive
          cp /tmp/symarc028-reproduction.log archive/
          git rev-parse HEAD > archive/source-revision.txt
          tar -czf archive/symarc028-evidence.tar.gz -C /tmp symarc028/run
          sha256sum archive/symarc028-evidence.tar.gz > archive/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symarc-028-verified
          path: archive/
          retention-days: 90
          if-no-files-found: error
