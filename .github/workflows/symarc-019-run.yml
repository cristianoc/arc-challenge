name: Measure frozen ARC1 transfer
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-019-run.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Register run and execute unchanged learners
        shell: bash
        run: |
          set -euo pipefail
          E=symarc/experiments/019-arc1-transfer
          mkdir -p arc019/run
          git rev-parse HEAD > arc019/source-revision.txt
          rustc --version > arc019/rustc.txt
          python3 --version > arc019/python.txt
          (cd symarc && cargo test --release && cargo build --release && python3 tests/check.py) > arc019/core-checks.txt 2>&1
          python3 symarc/experiments/018-order-guards/test_run.py > arc019/018-checks.txt 2>&1
          python3 "$E/run.py" prepare --data data --out arc019/input
          cargo run --release --manifest-path "$E/Cargo.toml" -- arc019/input/stable > arc019/run/stable.jsonl 2>arc019/run/stable.log
          python3 symarc/experiments/018-order-guards/run.py predict --problems arc019/input/problems.json --out arc019/run/relational --workers 12
          python3 "$E/run.py" freeze --out arc019/run
          python3 "$E/run.py" score --out arc019/run --answers arc019/input/answers.json > arc019/run/report.txt
          cat arc019/run/report.txt
          mkdir -p archive
          tar -czf archive/arc019-evidence.tar.gz arc019 "$E" symarc/src symarc/Cargo.toml symarc/Cargo.lock symarc/experiments/RESULTS.md
          sha256sum archive/arc019-evidence.tar.gz > archive/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symarc-019-arc1-evidence
          path: archive/
          retention-days: 90
          if-no-files-found: error
