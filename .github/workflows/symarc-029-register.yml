name: Register SymArc 029
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-029-register.yml]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Preserve the existing ledger and register the new protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('symarc/experiments/RESULTS.md')
          text=p.read_text()
          assert '### 029-relational-reduction' not in text
          entry='''### 029-relational-reduction — Do relational consequences reveal information before individual answers?
          Status: active — fixed protocol and source hashes registered before scientific execution.
          Baseline: 2f534a92; protocol f8cd4a95. Reuse 028's 401 exact input classes, 260 semantic classifiers and two source seeds; no new grammar, geometric primitive or ARC score. Compare hypothesis halving, marginal consequence reduction and pair-consequence reduction on every one of the 260 functions as supplied target, with at most eight extra source labels. These are exhaustive closed-world simulations, not independent natural tasks.
          Question: quantify newly forbidden output pairs whose coordinates remain individually ambiguous; construct forced input equivalences relative to surviving hypotheses. Pairwise information need not capture higher-order constraints or improve a greedy acquisition policy. All pairs equally weighted by explicit choice.
          Checks: twelve synthetic tests passed, including 300 finite reference comparisons, label complementation, empty-family handling, nonbinary projection and parity obstruction. Independent column-intersection audit and exact 028 path replay planned. No scientific outcome yet.
          Code/evidence: [protocol](029-relational-reduction/README.md); source hashes in preregistration.json. Stable solver and accepted mathematics unchanged.

          '''
          text=text.replace('## Entry format',entry+'## Entry format')
          p.write_text(text)
          e=Path('symarc/experiments/029-relational-reduction')
          obj={'baseline':'2f534a92f728bde2446b368cc03f68a8ad14cd34','protocol':'f8cd4a95cb0c622f0d35ac4d7760421fe3069080','source_hashes':{'run.py':'820a80aac729d6c6c3d810030d24f4957d3b33887e4ad6cb4aeb8b6aadc115e6','test_run.py':'284e1db989b9268050b25d2d36b2fbe4384af4efba33c69fa37e7f7aabc3601b'},'synthetic_tests_passed':12,'random_reference_cases':300,'scientific_run_started':False}
          (e/'preregistration.json').write_text(json.dumps(obj,indent=2)+'\n')
          Path('.github/workflows/symarc-029-register.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/experiments/RESULTS.md symarc/experiments/029-relational-reduction/preregistration.json .github/workflows/symarc-029-register.yml
          git commit -m 'experiments: register exact relational consequence study before execution'
          git push origin HEAD:symarc/stable-core
