name: Verify and finalize SymArc 029
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-029-finalize.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Verify frozen sources and reproduce all semantic results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          e=Path('symarc/experiments/029-relational-reduction')
          reg=json.loads((e/'preregistration.json').read_text())
          for name,want in reg['source_hashes'].items():
              assert hashlib.sha256((e/name).read_bytes()).hexdigest()==want,name
          assert hashlib.sha256((e/'audit.py').read_bytes()).hexdigest()=='0b83c765a15148adebd11e620caae358fd3f0eecb224383ce227f3ea8342a530'
          PY
          python3 symarc/experiments/029-relational-reduction/reproduce.py --out evidence029
          python3 symarc/experiments/029-relational-reduction/quotient.py --predictions evidence029/result/predictions.json --before 0x50550544000000000055050500400000001540000400040 --after 0x50500000000000000000000000400000000000000400000 --out evidence029/result/quotient-example.json
      - name: Record audited results without changing previous experiments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,os
          from pathlib import Path
          root=Path('evidence029/result')
          data=json.loads((root/'predictions.json').read_text())
          summary=json.loads((root/'summary.json').read_text())
          audit=json.loads((root/'audit.json').read_text())
          dest=Path('symarc/experiments/evidence/029-relational-reduction')
          (dest/'results.json').write_text(json.dumps({'summary':summary,'checks':{k:v for k,v in audit.items() if k!='decoded_witnesses'}},indent=2)+'\n')
          example=summary['first_relational_examples'][0]
          case=None
          for trace in data['traces']:
              for i,step in enumerate(trace['steps']):
                  if trace['states'][i]['version']==example['before'] and trace['states'][i+1]['version']==example['after'] and step['query']==example['query']:
                      case={'target':trace['target'],'policy':trace['policy'],'seed_labels':trace['seed_labels'],'preceding_observations':[[q['query'],q['label']] for q in trace['steps'][:i]],'new_observation':[step['query'],step['label']],'witness':audit['decoded_witnesses'][0]}
                      break
              if case:break
          assert case is not None
          (dest/'case-certificate.json').write_text(json.dumps(case,indent=2)+'\n')
          quotient=json.loads((root/'quotient-example.json').read_text())
          assert len(quotient['before']['classes'])==33 and len(quotient['after']['classes'])==7
          for i in [74,85]:
              c=quotient['after']['input_to_class'][i]
              assert c==1 and quotient['after']['classes'][c]['possible_labels']==[0,1]
          (dest/'verification.json').write_text(json.dumps({'workflow_run':os.environ['GITHUB_RUN_ID'],'source_revision':os.environ['GITHUB_SHA'],'source_hashes_checked':True,'synthetic_tests':12,'four_semantic_hashes_match':True,'quotient_example_classes':[33,7],'status':'success'},indent=2)+'\n')
          ledger=Path('symarc/experiments/RESULTS.md');text=ledger.read_text()
          entry='''### 029-relational-reduction — Does reduction reveal relations before individual answers?
          Status: candidate — retain exact relational consequences and finite quotient extraction as diagnostics; no acquisition-policy or stable-solver integration.
          Baseline: 2f534a92; protocol f8cd4a95 and source hashes registered before execution. Unchanged 028 family: 401 exact input classes, 260 semantic classifiers, same two seed inputs and at most eight extra requested labels. Every classifier serves as target. This is closed-world enumeration under a noiseless teacher, not independent natural tasks or a new ARC score.
          Result: after five extra labels halving identifies 20/260 and marginal/pair scope 26/260; after eight, halving 188/260 versus 172/260. Marginal and pair policies have identical paths on all targets. At eight, scope uniquely gains 16 identifications but loses 32 relative to halving. All 16 original geometric scope/halving traces reproduce; their prior advantage does not extend uniformly across this larger target family.
          Construction: 254 distinct acquisition edges rule out joint output pairs while both individual labels remain undecided. A negative singleton reduces one family 25 to six and its universally respected input quotient 33 to seven classes, forcing two unlabelled L-shaped inputs to agree while their common label remains unknown. Define x~Vx' iff every h in V gives equal outputs; reducing V can only coarsen this canonical universal quotient. This differs from existence of a fitting selector for a quotient, which need not yield a greatest coherent quotient. quotient.py exports actual classes, selectors and old-to-new class maps. It is a finite conditional abstraction, not a compact geometric feature learner.
          Limits: pair information does not imply a better greedy policy, and parity controls show that pairs can miss higher-order constraints. Unit weighting of semantic classes/pairs is explicit. No new labels exist without the supplied oracle. Core mathematics and existing ARC configurations unchanged.
          Checks: twelve synthetic tests, 300 finite reference comparisons, independent column-intersection audit of 104260 geometry/classifier values, 2838 subfamily measures, 996 policy states, 6290 trace states, 5510 requested labels, 390 label-complement pairs and all relational witnesses. Underlying grammar reused. Four semantic hashes and the quotient example are independently reproduced in this GitHub run.
          Code/evidence: [protocol and sources](029-relational-reduction/README.md), [report](evidence/029-relational-reduction/README.md), compact outcomes, case certificate and verification metadata. Full source, traces, inherited baseline and executable reproduction in companion archive. Prediction SHA-256 4ea7649492f5272a6c8bcee4daffb72ba928f4d9dc27e47dacbb49aae6d711f5.

          '''
          updated,n=re.subn(r'^### 029-relational-reduction\b.*?(?=^### |^## Entry format)',entry,text,flags=re.M|re.S)
          assert n==1,n
          ledger.write_text(updated)
          Path('.github/workflows/symarc-029-finalize.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/experiments/RESULTS.md symarc/experiments/evidence/029-relational-reduction .github/workflows/symarc-029-finalize.yml
          git commit -m 'experiments: retain audited relational reduction and qualify earlier scope result'
          git push origin HEAD:symarc/stable-core
          mkdir -p archive
          git rev-parse HEAD > evidence029/source-revision.txt
          tar -czf archive/symarc-029-full.tar.gz evidence029 symarc/experiments/029-relational-reduction symarc/experiments/evidence/029-relational-reduction symarc/experiments/028-generality-reduction/run.py symarc/experiments/027-constructed-spatial-sets/language.py
          sha256sum archive/symarc-029-full.tar.gz > archive/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symarc-029-verified
          path: archive/
          retention-days: 90
          if-no-files-found: error
