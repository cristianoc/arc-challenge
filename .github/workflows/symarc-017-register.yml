name: Register frozen SymArc 017
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-017-register.yml]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Write frozen sources and active ledger entry
        env:
          PAYLOAD: 
        run: |
          python3 - <<'PY'
          import base64,gzip,json,os,hashlib
          from pathlib import Path
          files=json.loads(gzip.decompress(base64.b64decode(os.environ['PAYLOAD'])))
          for name,content in files.items():
              assert name.startswith('symarc/experiments/017-split-or-share/')
              p=Path(name); p.parent.mkdir(parents=True,exist_ok=True); assert not p.exists(); p.write_text(content)
          meta=json.loads(Path('symarc/experiments/017-split-or-share/preregistration.json').read_text())
          for name,h in meta['sources'].items(): assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h
          ledger=Path('symarc/experiments/RESULTS.md'); text=ledger.read_text()
          assert '### 017-split-or-share' not in text and '\n## Entry format' in text
          entry='''
          ### 017-split-or-share — Split a context, or share a better operation?
          Status: active — protocol and exact source hashes registered before corpus execution.
          Baseline: `71c9efdf`; protocol `f37093f7`; official ARC-AGI-2 `f3283f7`, 1000 training + 120 evaluation tasks. Development fixtures `00d62c1b` and `e88171ec` excluded; public development data, not untouched holdout.
          Comparison: four matched arms, base/split/share/joint: 15 vs 19 features, 11 vs 19 actions. New constructor follows a same-colour directional run, exposes its length or reads beyond it; four adjacent copies included. Exact minimal conflict sets, all minimal feature subsets of size <=3, nested whole-demonstration validation, a union selector retaining base candidates, isolated query scoring. Twelve workers, deterministic.
          Checks: sixteen pre-corpus synthetic controls passed, including a three-way inconsistency and 150 guided/exhaustive subset comparisons. Source hashes in preregistration.json. Primary run not yet executed.
          Decision: distinguish representation, operation and prediction improvements; keep unresolved and action-ambiguous cases explicit. No stable-core/math integration.
          Code/evidence: [registered protocol and sources](017-split-or-share/README.md).
          '''
          ledger.write_text(text.replace('\n## Entry format','\n'+entry+'\n## Entry format'))
          Path('.github/workflows/symarc-017-register.yml').unlink()
          PY
          python3 symarc/experiments/017-split-or-share/test_run.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/experiments/017-split-or-share symarc/experiments/RESULTS.md .github/workflows/symarc-017-register.yml
          git commit -m 'experiment: freeze split-or-share sources and active ledger'
          git push origin HEAD:symarc/stable-core
