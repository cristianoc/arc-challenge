name: Finalize audited SymArc 021
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-021-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Check frozen source and finalize only this ledger entry
        shell: bash
        run: |
          set -euo pipefail
          E=symarc/experiments/021-default-exceptions
          echo "00e524797730b2068126004b01b5f5e7aecb1eba2050ce6c482bdd1b48d1645d  $E/run.py" | sha256sum -c -
          echo "187dd972bbdf0018e20bc2fd877ae3c0a73be88b1c87d335c64c239a17327c92  $E/test_run.py" | sha256sum -c -
          python3 "$E/test_run.py"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('symarc/experiments/RESULTS.md');text=p.read_text()
          start=text.index('### 021-default-exceptions');end=text.index('## Entry format',start)
          assert '### ' not in text[start+4:end]
          entry='''### 021-default-exceptions — Can a shared default preserve distinct applicability contexts?
          Status: closed — partial operation-identification repair, unresolved scope selection; retain exact variant and controls for comparison, no integration.
          Baseline: `11466555`; protocol/source hashes `b9227afb`, active registration `41304763`, runner `07a853b0`, before scientific runs. Same 018 features, operations, search bound, nested validation and ranking. All defaults minimizing the number of observed exception contexts survive; unknown keys still abstain. This is a representation-dependent prior, not new data or an unconditional copy fallback.
          ARC1: all 400+400 tasks and unchanged 019 stable/no-fit combination. Relational alone goes 27 to 29 training solutions, but one to four complete errors; evaluation stays five solutions and zero complete errors. Composition goes **78 to 80 training, 27 to 27 evaluation**, gaining `3bdb4ada` and `97999447` with no solved-task loss. Correct grids 83/416 to 85/416 and 31/419 unchanged. Excluding prior fixtures: 76/398 to 78/398, 27/399 unchanged. Reused public data, not independent holdout. Both gains retain their old features and complete 17 unchanged cells; not new feature discovery.
          Controlled result: old two endpoint teachers plus four literal-output variants, 84 constructed grids. Both learners solve 42, make 18 complete wrong grid answers and abstain on 24. The available endpoint-validity model solves 84/84 but is not selected. On copy teachers the new default removes endpoint ambiguity and raises the correct guard's score from 634/385 to 134/77, tying the wrong guard. The unchanged fewer-features tie-break still loses. Literal-background controls learn default constant 6, not copy. Teacher labels are not ARC ground truth.
          Limitations: strict outer relational gate loses `a5313dff` (10 to 9 correct training answers), evaluation remains three; no complete errors behind the gate. An individually correct `d5d6de2d` query is lost through reselection without losing a fully solved task. Context splitting can change default preference even with no new labels. Fixed-model prediction preservation does not imply whole-learner correctness or monotonicity.
          Checks: 12 synthetic controls and 300 exhaustive tiny-program comparisons. All 800 base predictions match 019 byte-for-byte; repeated default predictions match all batches. Set-based audit checks 24353 ARC1 table records, 408177 defaults, 1100428 context projections, 2128 identical feature pools, 5866 candidate grids, 17152 inner/8445 outer grids and 2660 full-data choices; separate score audit checks 8800 policy/task decisions. Controlled audit adds 4772 table records. Primitive extraction/search/outer selector are not independently reimplemented. Twelve workers, serial 100-task batches, no dropped tasks or budget change; primary default time 54.456s is provenance only.
          Decision: close targeted guard-repair study without changing the existing 019 composition or stable core. Further scope learning needs discriminating evidence or explicitly retained alternatives, not a silent tie-break change. Accepted mathematics unchanged.
          Code/evidence: [protocol and sources](021-default-exceptions/README.md), [findings](evidence/021-default-exceptions/README.md), compact outcomes and full reproduction archive. Default prediction SHA-256 `9ef4d2a4add18023bbb13bfd6fd75bb5c86c03f04a933391b0949dbba858993f`.

          '''
          p.write_text(text[:start]+textwrap.dedent(entry)+text[end:])
          Path('.github/workflows/symarc-021-finalize.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/experiments/RESULTS.md .github/workflows/symarc-021-finalize.yml
          git commit -m 'experiments: record 021 results; remove completed finalization workflow'
          git push origin HEAD:symarc/stable-core
          mkdir -p archive
          git rev-parse HEAD > archive/source-revision.txt
          tar -czf archive/source-snapshot.tar.gz symarc/experiments/021-default-exceptions symarc/experiments/evidence/021-default-exceptions symarc/experiments/RESULTS.md
          sha256sum archive/source-snapshot.tar.gz > archive/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symarc-021-source-snapshot
          path: archive/
          retention-days: 90
          if-no-files-found: error
