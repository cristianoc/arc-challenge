name: SymArc accepted mathematics
on:
  push:
    branches: [symarc/stable-core, main]
    paths:
      - 'symarc/SymArc.lean'
      - 'symarc/SymArc/**'
      - 'symarc/lean-toolchain'
      - 'symarc/lakefile.toml'
      - 'symarc/tests/learning_axioms.lean'
      - '.github/workflows/symarc-math.yml'
  pull_request:
    paths:
      - 'symarc/SymArc.lean'
      - 'symarc/SymArc/**'
      - 'symarc/lean-toolchain'
      - 'symarc/lakefile.toml'
      - 'symarc/tests/learning_axioms.lean'
      - '.github/workflows/symarc-math.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install versioned elan bootstrap
        run: |
          curl -fsSL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile core proofs and audit their axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p math-evidence
          git rev-parse HEAD > math-evidence/source-revision.txt
          cd symarc
          lake build 2>&1 | tee ../math-evidence/lake-build.txt
          lake env lean tests/learning_axioms.lean 2>&1 | tee ../math-evidence/axioms.txt
          if grep -q 'sorryAx' ../math-evidence/axioms.txt; then exit 1; fi
          if grep -nE '^[[:space:]]*(axiom|opaque)[[:space:]]|\b(sorry|admit)\b' SymArc/Learning.lean; then exit 1; fi
          lean --version > ../math-evidence/lean-version.txt
      - name: Check unchanged Rust solver
        shell: bash
        run: |
          set -euo pipefail
          cd symarc
          cargo test --release 2>&1 | tee ../math-evidence/rust-tests.txt
          cargo build --release
          python3 tests/check.py 2>&1 | tee ../math-evidence/regressions.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: symarc-math-evidence
          path: math-evidence/
          retention-days: 90
