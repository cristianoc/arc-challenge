name: Verify and finalize SymArc 027
on:
  push:
    branches: [symarc/stable-core]
    paths: [.github/workflows/symarc-027-finalize.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: symarc/stable-core
      - name: Check published hashes and independently repeat scientific outputs
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          e=Path('symarc/experiments/027-constructed-spatial-sets')
          for name,value in json.loads((e/'preregistration.json').read_text())['source_hashes'].items():
              assert hashlib.sha256((e/name).read_bytes()).hexdigest()==value,name
          assert hashlib.sha256((e/'audit.py').read_bytes()).hexdigest()=='ab742ceae791f6519c68c5c313fc561377a0ec3754159a20dfd401ddf16c75bd'
          PY
          python3 symarc/experiments/027-constructed-spatial-sets/reproduce.py --out /tmp/symarc027 --reference symarc/experiments/evidence/027-constructed-spatial-sets/scientific-hashes.json
      - name: Record completed experiment without altering previous results
        run: |
          python3 - <<'PY'
          import re,textwrap
          from pathlib import Path
          p=Path('symarc/experiments/RESULTS.md');s=p.read_text()
          entry='''### 027-constructed-spatial-sets — Can a constructed spatial set support recognition and generation?
          Status: candidate — bounded set-expression construction and generative reuse; no solver integration or new accepted mathematics.
          Baseline: 37a312e7; protocol c3078d3a and active ledger before scientific runs; tested source hashes df0ab32c before execution, published unchanged afterwards. Generic coordinate extrema and Cartesian carrier supplied, no frame atom. Build Boolean point expressions through seven nodes, charge expanded costs, quotient by complete sixteen-role semantics rather than training traces.
          Construction: 511 labelled nonempty 3x3 sets produce the disjunction of row/column minimum/maximum equalities. Expanded point predicate/set/classifier costs 27/44/49. Independent raw enumeration of 90690 ordered trees recovers the same 366 semantic candidates and unique minimum classifier. Matched direct and coherence constructions use 187026 profile checks each; label checks 7119/4757. This is not a new general algorithm or runtime claim.
          Outcomes: dense recognition 65535/65535 on 4x4 subsets (100 positive, 65435 negative), with 511 source overlaps and 65024 genuinely new correct sets; larger/translated bank 2317/2317 (21 positives). Frozen body supports two new set-valued targets, completion and interior extraction, each 2317/2317 with one demonstration overlap. Target operations learned from two examples each; 2316 new inputs correct. Bounds/segmentation are supplied and corruptions preserve extrema. No new ARC score or unrelated-task transfer claim.
          Sparse control: the fixed two-example old collision instead selects a cheaper inverse missing-corner classifier, 136/65535 primary and 21/2317 larger correct, with no abstentions. No tuning. Actual sparse primary source overlap is two; the frozen scorer's common-source overlap field refers to the dense bank, corrected explicitly by auditor/summary. Post-score role-coverage diagnostic finds six examples uniquely determining the semantic program across all 65536 Boolean tables and four label maps, without any syntax bound. This is target-informed teaching evidence, not passive sparse learning or a minimum teaching-size proof.
          Negative boundary: full 5x5 sets minus centre versus minus (1,1) have equal scalar and extrema-role profiles but different thickness-two labels; every template in the entire semantic language identifies them. No distance atom is added after the outcome. Source positives cover all sixteen point roles, so large query totals test interpreter reuse, not many independent generalisation events.
          Checks: thirteen synthetic tests, forty direct/constructive controls, 365 rejection certificates, independent 67852 teacher cases, 135704 recognition and 4634 set-output replays. Auditor imports neither scientific module and enumerates raw syntax independently. Local repeat matches seven scientific hashes; this GitHub workflow independently repeats the full reproduction before finalizing. No semantic policy or source change after scores.
          Code/evidence: [protocol and standalone sources](027-constructed-spatial-sets/README.md), [report](evidence/027-constructed-spatial-sets/README.md), compact results and scientific hashes. `reproduce.py` regenerates data, library, predictions, scores and audit. Prediction hash d16fa2262e8c04ea1b350e042170d964d69bb50a824709fedd827849a093cbc1. Core proofs, stable Rust solver and previous ARC wrappers unchanged.

          '''
          s,n=re.subn(r'^### 027-constructed-spatial-sets\b.*?(?=^### |^## Entry format)',textwrap.dedent(entry),s,flags=re.M|re.S)
          assert n==1,n;p.write_text(s)
          Path('.github/workflows/symarc-027-finalize.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add symarc/experiments/RESULTS.md .github/workflows/symarc-027-finalize.yml
          git commit -m 'experiments: retain verified spatial construction and exact teaching boundary'
          git push origin HEAD:symarc/stable-core
          mkdir -p archive
          git rev-parse HEAD > archive/source-revision.txt
          tar -czf archive/symarc-027-evidence.tar.gz -C /tmp symarc027
          sha256sum archive/symarc-027-evidence.tar.gz > archive/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symarc-027-verified-evidence
          path: archive/
          retention-days: 90
          if-no-files-found: error
